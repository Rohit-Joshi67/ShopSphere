<svg width="700" height="820" viewBox="0 0 700 820" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>ShopSphere animated architecture flow</title>
<desc>React client authenticates through a JWT gateway, requests hit Product, Order, Inventory and Notification Spring Boot services, an Order-Placed event flows through Kafka, data lands in PostgreSQL, all inside Docker and Kubernetes.</desc>

<style>
  .card { fill: #ffffff; stroke: #d6d3c9; stroke-width: 1; }
  .cardDark { fill: #f4f2ea; stroke: #b4b2a9; stroke-width: 1; }
  .label { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #26251f; }
  .sub { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; fill: #6b6a63; }
  .grp { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #444441; }
  .flow { stroke: #1D9E75; stroke-width: 2.5; stroke-dasharray: 6 8; fill: none; }
  .flowBlue { stroke: #378ADD; stroke-width: 2.5; stroke-dasharray: 6 8; fill: none; }
  .flowCoral { stroke: #D85A30; stroke-width: 2.5; stroke-dasharray: 6 8; fill: none; }
</style>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#8a887f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <animate xlink:href="#dummy" attributeName="opacity" values="1" dur="1s"/>
</defs>

<rect width="700" height="820" fill="#fbfaf6"/>

<!-- React client -->
<rect x="250" y="20" width="200" height="70" rx="10" class="card"/>
<image x="266" y="36" width="38" height="38" href="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/react.svg"/>
<text x="316" y="52" class="label">React</text>
<text x="316" y="70" class="sub">Vite · hosted on Vercel</text>

<path class="flowBlue" d="M350 90 L350 130" marker-end="url(#arrow)">
  <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="0.9s" repeatCount="indefinite"/>
</path>

<!-- JWT gateway -->
<rect x="230" y="134" width="240" height="70" rx="10" class="card"/>
<image x="246" y="150" width="38" height="38" href="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/jsonwebtokens.svg"/>
<text x="296" y="166" class="label">Spring Security · JWT</text>
<text x="296" y="184" class="sub">Stateless auth, role-based access</text>

<path class="flowBlue" d="M350 204 L350 244" marker-end="url(#arrow)">
  <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="0.9s" repeatCount="indefinite"/>
</path>

<!-- Microservices group container -->
<rect x="40" y="248" width="620" height="160" rx="16" class="cardDark"/>
<text x="60" y="272" class="grp">Spring Boot microservices</text>
<image x="580" y="256" width="26" height="26" href="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/spring.svg"/>

<!-- 4 services -->
<g>
  <rect x="60" y="290" width="130" height="94" rx="10" class="card"/>
  <image x="112" y="300" width="26" height="26" href="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/openjdk.svg"/>
  <text x="125" y="352" text-anchor="middle" class="label">Product</text>
  <text x="125" y="368" text-anchor="middle" class="sub">Catalog service</text>
</g>
<g>
  <rect x="205" y="290" width="130" height="94" rx="10" class="card"/>
  <image x="257" y="300" width="26" height="26" href="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/openjdk.svg"/>
  <text x="270" y="352" text-anchor="middle" class="label">Order</text>
  <text x="270" y="368" text-anchor="middle" class="sub">Places orders</text>
</g>
<g>
  <rect x="350" y="290" width="130" height="94" rx="10" class="card"/>
  <image x="402" y="300" width="26" height="26" href="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/openjdk.svg"/>
  <text x="415" y="352" text-anchor="middle" class="label">Inventory</text>
  <text x="415" y="368" text-anchor="middle" class="sub">Stock levels</text>
</g>
<g>
  <rect x="495" y="290" width="130" height="94" rx="10" class="card"/>
  <image x="547" y="300" width="26" height="26" href="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/openjdk.svg"/>
  <text x="560" y="352" text-anchor="middle" class="label">Notification</text>
  <text x="560" y="368" text-anchor="middle" class="sub">Sends alerts</text>
</g>

<path class="flow" d="M125 384 L125 424" marker-end="url(#arrow)"><animate attributeName="stroke-dashoffset" from="0" to="-28" dur="0.9s" repeatCount="indefinite"/></path>
<path class="flow" d="M270 384 L270 424" marker-end="url(#arrow)"><animate attributeName="stroke-dashoffset" from="0" to="-28" dur="0.9s" repeatCount="indefinite" begin="0.1s"/></path>
<path class="flow" d="M415 384 L415 424" marker-end="url(#arrow)"><animate attributeName="stroke-dashoffset" from="0" to="-28" dur="0.9s" repeatCount="indefinite" begin="0.2s"/></path>
<path class="flow" d="M560 384 L560 424" marker-end="url(#arrow)"><animate attributeName="stroke-dashoffset" from="0" to="-28" dur="0.9s" repeatCount="indefinite" begin="0.3s"/></path>

<!-- Kafka bar -->
<rect x="60" y="428" width="565" height="66" rx="12" fill="#fdece4" stroke="#D85A30" stroke-width="1">
  <animate attributeName="opacity" values="0.7;1;0.7" dur="1.8s" repeatCount="indefinite"/>
</rect>
<image x="80" y="444" width="34" height="34" href="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/apachekafka.svg"/>
<text x="128" y="456" class="label">Apache Kafka</text>
<text x="128" y="474" class="sub">Order-Placed events, async fan-out</text>

<path class="flowCoral" d="M342 494 L342 534" marker-end="url(#arrow)">
  <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="0.9s" repeatCount="indefinite"/>
</path>

<!-- PostgreSQL -->
<rect x="240" y="538" width="220" height="70" rx="10" class="card"/>
<image x="256" y="554" width="38" height="38" href="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/postgresql.svg"/>
<text x="306" y="570" class="label">PostgreSQL</text>
<text x="306" y="588" class="sub">Per-service databases</text>

<!-- Infra row -->
<rect x="60" y="640" width="280" height="80" rx="12" class="cardDark"/>
<image x="80" y="660" width="32" height="32" href="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/docker.svg"/>
<text x="124" y="672" class="label">Docker Compose</text>
<text x="124" y="690" class="sub">Local containers for every service</text>

<rect x="360" y="640" width="280" height="80" rx="12" class="cardDark"/>
<image x="380" y="660" width="32" height="32" href="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/kubernetes.svg"/>
<text x="424" y="672" class="label">Kubernetes</text>
<text x="424" y="690" class="sub">Orchestration and scaling</text>

<text x="350" y="760" text-anchor="middle" class="sub">Dashed lines animate to show a request flowing through the system in real time</text>
<image x="620" y="740" width="22" height="22" href="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/vercel.svg"/>
<image x="20" y="740" width="60" height="22" href="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/render.svg"/>
</svg>
